<!doctype html>
<meta charset="utf-8" />
<title>GUI Scraper - 作業フォルダ</title>
<body style="font:14px system-ui,-apple-system,Segoe UI,Roboto,Noto Sans JP,sans-serif; padding:16px;">
  <h1 style="margin:0 0 10px;">作業フォルダ</h1>
  <p>ここで選んだフォルダに各種ファイルを保存します。</p>
  <div style="display:flex; gap:8px; margin:12px 0;">
    <button id="pick">作業フォルダを選択</button>
    <button id="clear">解除</button>
  </div>
  <div id="status" style="color:#444;"></div>
  <script src="options.js" defer></script>
</body>
